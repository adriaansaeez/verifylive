<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Veritas · portada</title>
    <style>
      :root {
        --paper: #f2eee6;
        --paper-raised: #faf7f0;
        --ink: #16130e;
        --ink-soft: #4b443a;
        --ink-faint: #7c7264;
        --rule: #d5cdbe;
        --rule-strong: #b9ae9b;
        --accent: #b3401b;
        --display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
        --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, monospace;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
      }

      body {
        background:
          radial-gradient(1100px 620px at 18% -12%, #fcf9f3 0%, transparent 62%),
          radial-gradient(900px 520px at 92% 112%, #eee7da 0%, transparent 60%),
          var(--paper);
        color: var(--ink);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      /* grano fino: evita el degradado plano de las capturas */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.35;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.16'/></svg>");
        mix-blend-mode: multiply;
      }

      .frame {
        position: fixed;
        inset: 38px;
        border: 1px solid rgba(185, 174, 155, 0.55);
        pointer-events: none;
      }

      .frame::before,
      .frame::after {
        content: "";
        position: absolute;
        width: 86px;
        height: 86px;
        border-color: var(--rule-strong);
        border-style: solid;
      }

      .frame::before {
        top: -1px;
        left: -1px;
        border-width: 2px 0 0 2px;
      }

      .frame::after {
        right: -1px;
        bottom: -1px;
        border-width: 0 2px 2px 0;
      }

      .cover {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 0 80px;
        transform: translateY(-10px);
      }

      .kicker {
        font-family: var(--mono);
        font-size: 15px;
        letter-spacing: 0.44em;
        text-transform: uppercase;
        color: var(--accent);
        margin: 0 0 46px;
      }

      .mark {
        width: 104px;
        height: 104px;
        color: var(--ink);
        display: block;
        margin-bottom: 30px;
      }

      .name {
        font-family: var(--display);
        font-size: 176px;
        line-height: 0.94;
        font-weight: 500;
        letter-spacing: -0.035em;
        margin: 0;
        position: relative;
      }

      .name em {
        position: absolute;
        left: calc(100% + 24px);
        bottom: 24px;
        font-style: normal;
        font-family: var(--mono);
        font-size: 17px;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        color: var(--accent);
        white-space: nowrap;
      }

      .rule {
        width: 132px;
        height: 1px;
        background: var(--rule-strong);
        margin: 46px 0 44px;
      }

      .tagline {
        font-family: var(--display);
        font-size: 66px;
        line-height: 1.1;
        font-weight: 400;
        letter-spacing: -0.015em;
        color: var(--ink-soft);
        margin: 0;
      }

      .tagline strong {
        font-weight: 400;
        font-style: italic;
        color: var(--accent);
      }

      .foot {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 62px;
        display: flex;
        justify-content: center;
        gap: 26px;
        font-family: var(--mono);
        font-size: 12px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--ink-faint);
      }

      .foot span { display: inline-flex; align-items: center; gap: 26px; }

      .foot span::after {
        content: "";
        width: 26px;
        height: 1px;
        background: var(--rule-strong);
      }

      .foot span:last-child::after { display: none; }
    </style>
  </head>
  <body>
    <div class="frame"></div>

    <div class="cover">
      <p class="kicker">Verificación en directo</p>

      <svg class="mark" viewBox="0 0 48 48" fill="currentColor" aria-hidden="true">
        <path
          fill-rule="evenodd"
          d="M 6.4 30.4 Q 2.91 29.59 5.2 25.6 Q 1.92 24.08 5 20.8 Q 2.2 18.59 6 16.2 Q 4.09 13.23 8.6 11.8 Q 7.87 8.3 12.8 8.2 Q 13.38 4.29 18 5.6 Q 20.25 1.99 24 4.8 Q 27.75 1.99 30 5.6 Q 34.62 4.29 35.2 8.2 Q 40.13 8.3 39.4 11.8 Q 43.91 13.23 42 16.2 Q 45.8 18.59 43 20.8 Q 46.08 24.08 42.8 25.6 Q 45.09 29.59 41.6 30.4 Q 38.6 32 35.6 31.6 Q 33.6 32.4 31.9 29.6 C 31 27.6 31 25.2 31 23 L 31 14.2 C 31 11.5 29.9 10.4 27.8 10.4 L 20.2 10.4 C 18.1 10.4 17 11.5 17 14.2 L 17 23 C 17 25.2 17 27.6 16.1 29.6 Q 14.4 32.4 12.4 31.6 Q 9.4 32 6.4 30.4 Z M 5.2 18.4 L 11.8 18.9 L 11.8 17.7 L 5.2 17.2 Z M 5 25 L 11 25.5 L 11 24.3 L 5 23.8 Z M 42.8 18.4 L 36.2 18.9 L 36.2 17.7 L 42.8 17.2 Z M 43 25 L 37 25.5 L 37 24.3 L 43 23.8 Z"
        />
        <path
          d="M 17.8 15.6 C 17.8 12.6 19.3 11.2 21.6 11.2 L 26.4 11.2 C 28.7 11.2 30.2 12.6 30.2 15.6 L 30.2 18.6 C 30.2 22.2 29.6 24.4 28.2 26.4 C 27.2 27.8 25.8 29.2 24 29.2 C 22.2 29.2 20.8 27.8 19.8 26.4 C 18.4 24.4 17.8 22.2 17.8 18.6 Z"
        />
        <path
          fill-rule="evenodd"
          d="M 20.2 27.4 L 27.8 27.4 L 27.8 30.4 C 29.4 31.4 33.4 32 37 34 C 42 36.6 45 41 45.4 45.8 L 2.6 45.8 C 3 41 6 36.6 11 34 C 14.6 32 18.6 31.4 20.2 30.4 Z M 21.1 29.9 L 23.2 30.2 L 22.6 37.2 L 20.5 36.8 Z M 26.9 29.9 L 24.8 30.2 L 25.4 37.2 L 27.5 36.8 Z"
        />
      </svg>

      <h1 class="name">Veritas <em>live</em></h1>

      <div class="rule"></div>

      <p class="tagline">Que no te la <strong>cuelen</strong>.</p>
    </div>

    <div class="foot">
      <span>Cada dato con su fuente</span>
      <span>github.com/adriaansaeez/veritas-live</span>
    </div>
  </body>
</html>
